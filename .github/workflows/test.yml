name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate action metadata
        run: ruby -e "require 'yaml'; YAML.load_file('action.yml')"
      - name: Test CalVer generation
        run: bash tests/generate-calver.sh
